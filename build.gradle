plugins {
    id 'java'
    id 'idea'
    id 'gg.essential.loom' version '0.10.0.5'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = '1.4.5.5'
group = 'meldexun.renderlib'
base.archivesName = 'RenderLib-1.8.9-port-1.8.9'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

loom {
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
        useCustomMixin = false
        accessTransformer(file('src/main/resources/META-INF/accesstransformer.cfg'))
        mixinConfig('mixins.renderlib.json')
    }
    mixin {
        add(sourceSets.main, 'mixins.renderlib.refmap.json')
    }
    launchConfigs {
        client {
            property('fml.coreMods.load', 'meldexun.renderlib.asm.RenderLibPlugin')
            arg('--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker')
        }
    }
    runConfigs {
        client { runDir = 'run' }
        remove(getByName('server'))
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    ivy {
        url = 'https://github.com/'
        patternLayout {
            artifact '[organisation]/[module]/releases/download/v[revision]/[module]-[revision].[ext]'
        }
        metadataSources { artifact() }
    }
}

configurations {
    shade
    verificationSupport
    consumerVerification
    consumerVerifierAsm
    legacyFastutilVerification
}
configurations.implementation.extendsFrom(configurations.shade)

// The AP is build-only. Keep its newer Mixin/ASM separate from the Java 8 game runtime.
configurations.annotationProcessor.exclude(group: 'net.fabricmc', module: 'sponge-mixin')
['compileClasspath', 'runtimeClasspath'].each { name ->
    configurations.named(name) {
        resolutionStrategy.force 'org.apache.logging.log4j:log4j-api:2.0-beta9',
                'org.apache.logging.log4j:log4j-core:2.0-beta9',
                'org.ow2.asm:asm-debug-all:5.0.3'
    }
}

def configurationsBackportJar = file('vendor/ConfigurationsBackport-1.8.9-1.1-masqueou-mixin-0.7.11.jar')
def configurationsBackportApiJar = tasks.register('configurationsBackportApiJar', Jar) {
    archiveFileName = 'ConfigurationsBackport-1.8.9-1.1-masqueou-mixin-0.7.11-api.jar'
    destinationDirectory = layout.buildDirectory.dir('dependencies')
    from(zipTree(configurationsBackportJar)) { include 'my_life_is_bad/**' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'

    // The exact runtime Mixin binary from the validated Java 8 build is pinned locally.
    shade files('vendor/mixin-0.7.11-20180703.121122-1.jar')
    shade 'it.unimi.dsi:fastutil:8.5.19'
    shade files('vendor/asmutil-2.8.1-masqueou-log4j-beta9.jar')
    shade 'meldexun:MemoryUtil:1.1.0@jar'
    shade 'meldexun:MatrixUtil:1.5.0@jar'
    shade 'meldexun:ReflectionUtil:1.0.0@jar'
    shade 'meldexun:RandomUtil:1.0.0@jar'

    compileOnly files(configurationsBackportApiJar)
    modRuntimeOnly files(configurationsBackportJar)

    annotationProcessor('org.spongepowered:mixin:0.8.5') { transitive = false }
    annotationProcessor 'com.google.code.gson:gson:2.2.4'
    annotationProcessor 'com.google.guava:guava:17.0'

    verificationSupport 'com.google.code.gson:gson:2.2.4'
    verificationSupport 'com.google.guava:guava:17.0'
    verificationSupport 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    verificationSupport 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    consumerVerifierAsm 'org.ow2.asm:asm-debug-all:5.0.3'
    legacyFastutilVerification 'it.unimi.dsi:fastutil:7.1.0'
    if (providers.gradleProperty('nothiriumJar').isPresent()) {
        consumerVerification files(providers.gradleProperty('nothiriumJar').get())
    } else {
        consumerVerification 'my-life-is-bad:Nothirium-1.8.9-port:1.8.9-0.4.9-beta-2@jar'
    }
}

tasks.named('compileJava') { dependsOn configurationsBackportApiJar }

tasks.named('processResources') {
    inputs.property('version', project.version)
    inputs.property('mcversion', '1.8.9')
    filesMatching('mcmod.info') {
        expand(version: project.version, mcversion: '1.8.9')
    }
}

def modManifest = [
    'FMLCorePlugin': 'meldexun.renderlib.asm.RenderLibPlugin',
    'ForceLoadAsMod': 'true',
    'TweakOrder': '0',
    'ModSide': 'CLIENT',
    'FMLCorePluginContainsFMLMod': 'true',
    'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
    'MixinConfigs': 'mixins.renderlib.json',
    'FMLAT': 'accesstransformer.cfg'
]

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') {
    archiveClassifier = 'without-deps'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
    manifest.attributes(modManifest)
}
tasks.named('shadowJar') {
    configurations = [project.configurations.shade]
    archiveClassifier = 'dev-with-deps'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA',
            'module-info.class', 'META-INF/versions/**'
    manifest.attributes(modManifest)
}
tasks.named('remapJar') {
    dependsOn tasks.named('shadowJar')
    input = tasks.named('shadowJar').flatMap { it.archiveFile }
    archiveClassifier = ''
    fromM = 'named'
    toM = 'srg'
}
tasks.named('assemble') { dependsOn tasks.named('remapJar') }

def compileGLBufferMappingTest = tasks.register('compileGLBufferMappingTest', JavaCompile) {
    source files('src/main/java/meldexun/renderlib/util/GLBuffer.java',
            'src/main/java/meldexun/renderlib/util/GLException.java', fileTree('src/test/glbuffer'))
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('glbuffer-mapping-test')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs = ['-proc:none']
}
tasks.register('verifyGLBufferMappings', JavaExec) {
    dependsOn compileGLBufferMappingTest
    classpath = files(compileGLBufferMappingTest.map { it.destinationDirectory })
    mainClass = 'meldexun.renderlib.util.GLBufferMappingTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn tasks.named('verifyGLBufferMappings') }

def compileRuntimeRefmapTest = tasks.register('compileRuntimeRefmapTest', JavaCompile) {
    source 'src/verification/java/meldexun/renderlib/validation/RuntimeRefmapTest.java'
    classpath = configurations.shade + configurations.verificationSupport
    destinationDirectory = layout.buildDirectory.dir('runtime-refmap-test')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs = ['-proc:none']
}
tasks.register('verifyRuntimeRefmap', JavaExec) {
    dependsOn compileRuntimeRefmapTest, tasks.named('remapJar')
    classpath = files(compileRuntimeRefmapTest.map { it.destinationDirectory }) + configurations.shade + configurations.verificationSupport
    mainClass = 'meldexun.renderlib.validation.RuntimeRefmapTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    args(tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath)
}
tasks.named('check') { dependsOn tasks.named('verifyRuntimeRefmap') }

def compileConsumerCompatibilityTest = tasks.register('compileConsumerCompatibilityTest', JavaCompile) {
    source 'src/verification/java/meldexun/renderlib/validation/LibraryCompatibilityTest.java'
    classpath = configurations.consumerVerifierAsm
    destinationDirectory = layout.buildDirectory.dir('consumer-compatibility-test')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs = ['-proc:none']
}
tasks.register('verifyConsumerApi', JavaExec) {
    dependsOn compileConsumerCompatibilityTest, tasks.named('remapJar')
    classpath = files(compileConsumerCompatibilityTest.map { it.destinationDirectory }) + configurations.consumerVerifierAsm
    mainClass = 'meldexun.renderlib.validation.LibraryCompatibilityTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    doFirst {
        def support = configurations.verificationSupport + configurations.consumerVerifierAsm
        args(tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath,
                configurations.consumerVerification.singleFile.absolutePath, support.asPath)
        if (providers.gradleProperty('candidateJar').isPresent()) args(providers.gradleProperty('candidateJar').get())
        else if (providers.gradleProperty('fastutilProviderJar').isPresent()) args(providers.gradleProperty('fastutilProviderJar').get())
    }
}
tasks.named('check') { dependsOn tasks.named('verifyConsumerApi') }

def compileShaderBuilderCompatibilityTest = tasks.register('compileShaderBuilderCompatibilityTest', JavaCompile) {
    source 'src/verification/java/meldexun/renderlib/validation/ShaderBuilderCompatibilityTest.java',
            fileTree('src/verification/shader')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('shader-builder-compatibility-test')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(8) }
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs = ['-proc:none']
}
def registerShaderBuilderCheck = { String name, Closure provider ->
    tasks.register(name, JavaExec) {
        dependsOn compileShaderBuilderCompatibilityTest, tasks.named('remapJar')
        classpath = files(compileShaderBuilderCompatibilityTest.map { it.destinationDirectory })
        mainClass = 'meldexun.renderlib.validation.ShaderBuilderCompatibilityTest'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
        doFirst {
            args(tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath,
                    provider().absolutePath,
                    compileShaderBuilderCompatibilityTest.get().destinationDirectory.get().asFile.absolutePath)
        }
    }
}
registerShaderBuilderCheck('verifyShaderBuilderLegacyFastutil', { configurations.legacyFastutilVerification.singleFile })
registerShaderBuilderCheck('verifyShaderBuilderBundledFastutil', { tasks.named('remapJar').get().archiveFile.get().asFile })
tasks.named('check') { dependsOn 'verifyShaderBuilderLegacyFastutil', 'verifyShaderBuilderBundledFastutil' }
if (providers.gradleProperty('fastutilProviderJar').isPresent()) {
    registerShaderBuilderCheck('verifyShaderBuilderCoremodFastutil', { file(providers.gradleProperty('fastutilProviderJar').get()) })
    tasks.named('check') { dependsOn 'verifyShaderBuilderCoremodFastutil' }
}

apply from: 'gradle/verify-artifact.gradle'

tasks.register('buildAndCopyToMods', Copy) {
    dependsOn tasks.named('remapJar')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(providers.gradleProperty('modsDir').orElse('run/mods'))
}
